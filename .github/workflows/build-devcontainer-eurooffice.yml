name: Build Dev Container (dev-eurooffice)

on:
  push:
    branches: [main, master]
    paths:
      - 'devcontainer/dev-eurooffice/**'
      - '.github/workflows/build-devcontainer-eurooffice.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'devcontainer/dev-eurooffice/**'
      - '.github/workflows/build-devcontainer-eurooffice.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-and-scan:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/template-build-scan.yml
    with:
      image_name: 'dev-eurooffice'
      context: './devcontainer/dev-eurooffice'
      dockerfile: './devcontainer/dev-eurooffice/Containerfile'
    secrets: inherit