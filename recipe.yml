---
name: os-base
description: Custom Aurora NVIDIA system with extras, Flatpaks & CH keyboard
base-image: ghcr.io/ublue-os/aurora-nvidia-open
# stable = Aurora's conservative stream (gated kernel); latest tracks the newest Fedora kernel
image-version: stable

modules:
  - from-file: common.yml
  # Force 120Hz on the internal display (safe fallback to 60Hz if unsupported)
  - type: kargs
    kargs:
      - video=eDP-1:2560x1600@120

  # Host CLI tools from signed repos: gh from Fedora, claude-code from Anthropic.
  # The Anthropic key is pinned in files/dnf/ (fingerprint 31DD DE24 DDFA B679
  # F42D 7BD2 BAA9 29FF 1A7E CACE, checked against code.claude.com/docs).
  - type: dnf
    repos:
      files:
        - claude-code.repo
      keys:
        - claude-code.asc
    install:
      packages:
        - gh
        - claude-code

  # x86-only Flatpaks: no aarch64 build on Flathub, so they must NOT go in the
  # shared common.yml list (would abort the whole uConsole install). Steam is
  # x86_64-only ("only-arches": ["x86_64"] in its flathub.json).
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.valvesoftware.Steam

  # Notebook-specific configs: declarative "fedora" user + subuid/subgid for
  # toolbox / rootless containers.
  - type: files
    files:
      - source: fedora-user.sysusers
        destination: /usr/lib/sysusers.d/50-fedora.conf
      - source: fedora-home.tmpfiles
        destination: /usr/lib/tmpfiles.d/50-fedora-home.conf
      - source: subuid
        destination: /usr/etc/subuid
      - source: subgid
        destination: /usr/etc/subgid

  # Verify updates: installs the container signing policy for this image, so
  # `ostree-image-signed:` only accepts images signed with cosign.pub.
  - type: signing
